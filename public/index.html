<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#161617">
  <meta name="description" content="Apple 中国大陆官方网站。你可以在这里选购 iPhone、Mac、iPad、Apple Watch、Vision 及更多产品。">
  <meta property="og:title" content="Apple (中国大陆) - 官方网站">
  <meta property="og:type" content="website">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png">
  <title>Apple (中国大陆) - 官方网站</title>
</head>

<body>
  <noscript>
    <strong>We're sorry but Apple doesn't work properly without JavaScript enabled. Please enable it to
      continue.</strong>
  </noscript>
  <div id="app">
    <!--
      首屏加载动画：JS 加载完之前显示，Vue 挂载后会自动替换掉
      不用等 JS 下载完才看到白屏，用户体验更好
    -->
    <div id="app-loading">
      <div class="loading-spinner"></div>
      <p class="loading-text">加载中...</p>
    </div>
  </div>
  <style>
    /* 首屏加载动画样式（内联在 index.html，不用等 CSS 加载） */
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #fff;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #f5f5f7;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      margin-top: 16px;
      color: #86868b;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <!-- built files will be auto injected -->
</body>

</html>
