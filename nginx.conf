# ============================================================
# nginx.conf —— 生产环境 Nginx 配置
# ------------------------------------------------------------
# 作用：Docker 容器里的 nginx 用这个配置
#
# 主要配置项：
#   1. gzip 压缩：减小传输体积
#   2. 静态资源缓存：JS/CSS/图片缓存一年，加快二次访问
#   3. history 路由支持：刷新不 404
#   4. 安全头：防止 XSS / 点击劫持
# ============================================================

server {
    # 监听端口（容器内部端口，Docker 映射到宿主机）
    listen 80;
    server_name localhost;

    # 网站根目录（Dockerfile 里复制过来的 dist/）
    root /usr/share/nginx/html;
    index index.html;

    # ======== gzip 压缩（配合项目打包生成的 .gz 文件） ========
    gzip on;
    gzip_static on;  # 直接用预压缩好的 .gz 文件，不用实时压缩
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;  # 大于 1KB 才压缩

    # ======== 静态资源缓存（JS/CSS/图片） ========
    # 带 hash 的静态资源，缓存一年，文件名变了就自动重新下载
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ======== history 路由支持 ========
    # Vue Router history 模式下，刷新 /cart 这种路径不会 404
    # 所有路由都回退到 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ======== 安全头（防止常见攻击） ========
    add_header X-Frame-Options "SAMEORIGIN";  # 防止被 iframe 嵌入（点击劫持）
    add_header X-Content-Type-Options "nosniff";  # 防止 MIME 类型嗅探
    add_header X-XSS-Protection "1; mode=block";  # XSS 防护

    # ======== 错误页面 ========
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
