# ============================================================
# docker-compose.yml —— Docker Compose 一键启动配置
# ------------------------------------------------------------
# 作用：一条命令启动整个项目，不用手动 docker build + docker run
#
# 启动命令：
#   docker-compose up -d
#
# 停止命令：
#   docker-compose down
#
# 重新构建 + 启动：
#   docker-compose up -d --build
# ============================================================

version: "3.8"

services:
  # 服务名称
  web:
    # 用当前目录的 Dockerfile 构建镜像
    build: .
    # 镜像名称（方便 docker images 看到）
    image: vue-apple-home:latest
    # 端口映射：宿主机 8080 -> 容器 80
    # 访问 http://localhost:8080 就能看到网站
    ports:
      - "8080:80"
    # 容器重启策略：服务器重启后自动启动
    restart: unless-stopped
